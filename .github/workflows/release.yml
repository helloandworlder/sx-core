name: sx-core Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build linux amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o sx-core-linux-amd64 ./main

      - name: Generate sha256 checksum
        run: sha256sum sx-core-linux-amd64 > sx-core-linux-amd64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sx-core-linux-amd64
          path: |
            sx-core-linux-amd64
            sx-core-linux-amd64.sha256

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sx-core
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.github/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sx-core
          cache-to: type=gha,mode=max,scope=sx-core

  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sx-core-linux-amd64

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/sx-core-linux-amd64/*
          body: |
            ## Docker Image

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/sx-core:${{ github.ref_name }}
            ```
